name: Release develop to main

# develop→mainのリリース（バージョンbump PR・develop→mainのPR作成）を行う。
# **本体は guchi-apps/issue-deck にあり、ここはトリガー定義だけの薄いcaller**
# （guchi-apps/issue-deck#1181）。issue-deckの画面のリリースボタンは、このファイルが
# 実在するリポジトリにだけ出る（guchi-apps/issue-deck#1538・#1591）。
#
# バンプPRはCI通過後にdevelopへ自動マージする。バンプPRがdevelopへマージされてバージョンが
# 変わると、push(develop, paths)で本ワークフローが再度起動し、develop→mainのPRを自動作成する。
# **develop→mainの実際のマージは自動マージ不可カテゴリに該当するため人間が手動で行う。**
#
# バンプPRの作成は人間の確認なしに走るため、scheduleでの自動起動はしない。
on:
  workflow_dispatch:
    inputs:
      bump_kind:
        # バージョンの上げ幅を人が決められるようにするための入口
        # （guchi-apps/issue-deck#1548）。issue-deckの画面のリリース起動ダイアログから渡る。
        # 既定の`auto`はコード差分からの自動判定。
        description: "バージョンの上げ幅（autoならコード差分から自動判定）"
        required: false
        type: choice
        default: auto
        options: [auto, patch, minor, major]
      # 新方式（リリース候補の作成→検証→公開準備）の要求。issue-deckのサーバーが組み立てる
      # JSONが渡る（guchi-apps/issue-deck#4623）。**この2つが無いと、issue-deck側は新方式に
      # 未対応のリポジトリとして通常の開始を止める**（旧方式へは落とさない）。
      # 指定があると共有ワークフローは旧方式の処理を行わず、候補の作成（candidate_request）か
      # 公開準備＝正式バンプ（finalize_request）だけを行う。人が手で入力する用途ではない。
      candidate_request:
        description: "リリース候補の作成・更新の要求（issue-deckが渡す。手入力しない）"
        required: false
        type: string
        default: ""
      finalize_request:
        description: "リリース候補の公開準備（正式バンプ）の要求（issue-deckが渡す。手入力しない）"
        required: false
        type: string
        default: ""
  # バンプPRがdevelopへマージされバージョンが変わったときに再起動して、develop→mainのPRを
  # 自動作成する。通常のフィーチャーpushでは変わらないため起動しない。
  push:
    branches: [develop]
    paths:
      - package.json

concurrency:
  group: release-develop-to-main
  cancel-in-progress: false

jobs:
  release:
    uses: guchi-apps/issue-deck/.github/workflows/reusable-release-develop-to-main.yml@workflows/v52
    # バージョンの読み書きに関する3つのinput（version-file・version-query・bump-command）は
    # すべて既定値でよい。ルートのpackage.jsonに version を持ち、npmを使い、`preversion`を
    # 持たないため。**共有ワークフローはバージョンbumpのために依存関係をインストールしない**
    # （setup-nodeもnpm ciも無い）ので、`version` lifecycleスクリプトはNode標準モジュール
    # だけで書き、`preversion`にテストを置かないこと。置くと既定のbumpコマンドが
    # node_modules不在で必ず落ちる（meisai-lab・clip-hiveはこの回避にbump-commandを渡している）。
    with:
      # pushトリガー（バンプPRのマージ）で起動したときは`inputs`自体が無いため空文字を渡す。
      # そちらの実行はdevelop→mainのPR作成だけを行い、上げ幅を使わない。
      bump-kind: ${{ github.event_name == 'workflow_dispatch' && inputs.bump_kind || '' }}
      # 新方式の要求。pushトリガーでは`inputs`が無いため、同じく空文字を渡す。
      candidate-request: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_request || '' }}
      finalize-request: ${{ github.event_name == 'workflow_dispatch' && inputs.finalize_request || '' }}
    secrets: inherit
    # **呼ばれる側の権限はcallerの付与範囲を超えられない。** issues が write なのは、
    # 呼ばれる側の notify-failure ジョブがリリース対象issueへ失敗を通知するため。
    # read にすると startup_failure になり、ジョブが1つも作られずログも残らない。
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
