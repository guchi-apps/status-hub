name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-ops-dashboard-production
  cancel-in-progress: true

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create Git tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          HEAD_SHA=$(git rev-parse HEAD)

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-parse "$TAG")
            if [ "$TAG_SHA" = "$HEAD_SHA" ]; then
              echo "Tag ${TAG} already points to HEAD"
              exit 0
            fi
            echo "::error::Tag ${TAG} already exists on ${TAG_SHA}, but HEAD is ${HEAD_SHA}. Bump package.json version before merging."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

  release:
    runs-on: ubuntu-latest
    needs: [tag, deploy]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect prerelease
        id: meta
        run: |
          TAG="${{ needs.tag.outputs.tag }}"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          skip_if_release_exists: true

      - name: Signaly に通知
        # 通知のためだけにジョブを分けない。Actionsの課金はジョブ単位で1分に切り上げられる
        # ため、数秒で終わるnotify-releaseジョブが実行のたびに1分かかっていた。
        #
        # 通知はリリースの合否そのものではない。ここが失敗してもrun全体を落とさない
        # （guchi-apps/issue-deck#1302）。
        if: always()
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}
          NOTIFY_STATUS: ${{ job.status }}
          NOTIFY_APP: ops-dashboard
          SIGNALY_RELEASE_WEBHOOK_URL: ${{ secrets.SIGNALY_RELEASE_WEBHOOK_URL }}
          NOTIFY_KIND: リリース
          NOTIFY_VERSION: ${{ needs.tag.outputs.tag }}
        run: bash .github/scripts/signaly-notify.sh

  build:
    runs-on: ubuntu-latest
    needs: tag

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んでいたが、
    # サービスアカウントの日次レート制限を使い切ってフリート全体のデプロイが止まった
    # （guchi-apps/issue-deck#1302）。SERVER_*・SUPABASE_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（#51）。
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      HOST: ${{ secrets.SERVER_HOST }}
      USERNAME: ${{ secrets.SERVER_USERNAME }}
      SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_PROJECT_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      TARGET_DIR: ${{ secrets.TARGET_DIR }}
      ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
      ANTHROPIC_OAUTH_REFRESH_TOKEN: ${{ secrets.ANTHROPIC_OAUTH_REFRESH_TOKEN }}
      OPENAI_CHATGPT_REFRESH_TOKEN: ${{ secrets.OPENAI_CHATGPT_REFRESH_TOKEN }}
      OPENAI_CHATGPT_ACCOUNT_ID: ${{ secrets.OPENAI_CHATGPT_ACCOUNT_ID }}
      GH_USAGE_TOKEN: ${{ secrets.GH_USAGE_TOKEN }}
      HOST_STATS_TOKEN: ${{ secrets.HOST_STATS_TOKEN }}
      UPTIMEROBOT_READ_ONLY_KEY: ${{ secrets.UPTIMEROBOT_READ_ONLY_KEY }}
      UPTIMEKUMA_USERNAME: ${{ secrets.UPTIMEKUMA_USERNAME }}
      UPTIMEKUMA_PASSWORD: ${{ secrets.UPTIMEKUMA_PASSWORD }}
      UPTIMEKUMA_ADMIN_TOKEN: ${{ secrets.UPTIMEKUMA_ADMIN_TOKEN }}
      WIDGET_TOKEN: ${{ secrets.WIDGET_TOKEN }}
      SHARED_TOKEN_API_SECRET: ${{ secrets.SHARED_TOKEN_API_SECRET }}
      SHARED_TOKEN_WRITE_SECRET: ${{ secrets.SHARED_TOKEN_WRITE_SECRET }}
      ISSUE_DECK_URL: ${{ vars.APP_BASE_URL }}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${{ secrets.WEB_PUSH_VAPID_PUBLIC_KEY }}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${{ secrets.WEB_PUSH_VAPID_PRIVATE_KEY }}
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}
      SIGNALY_LOGIN_WEBHOOK_URL: ${{ secrets.SIGNALY_LOGIN_WEBHOOK_URL }}
      SIGNALY_ALERT_WEBHOOK_URL: ${{ secrets.SIGNALY_ALERT_WEBHOOK_URL }}
      GH_USAGE_ORG: ${{ vars.GH_USAGE_ORG }}
      UPTIMEKUMA_BASE_URL: ${{ vars.UPTIMEKUMA_BASE_URL }}
      UPTIMEKUMA_DASHBOARD_SLUG: ${{ vars.UPTIMEKUMA_DASHBOARD_SLUG }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          ALLOWED_EMAILS: ${{ env.ALLOWED_EMAILS }}
          UPTIMEROBOT_READ_ONLY_KEY: ${{ env.UPTIMEROBOT_READ_ONLY_KEY }}
          UPTIMEKUMA_BASE_URL: ${{ env.UPTIMEKUMA_BASE_URL }}
          UPTIMEKUMA_DASHBOARD_SLUG: ${{ env.UPTIMEKUMA_DASHBOARD_SLUG }}
          SIGNALY_LOGIN_WEBHOOK_URL: ${{ env.SIGNALY_LOGIN_WEBHOOK_URL }}

      - name: Create archive
        run: |
          tar -czf deploy.tar.gz \
            package.json \
            package-lock.json \
            public \
            .next \
            deploy \
            scripts \
            next.config.mjs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: deploy.tar.gz
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んでいたが、
    # サービスアカウントの日次レート制限を使い切ってフリート全体のデプロイが止まった
    # （guchi-apps/issue-deck#1302）。SERVER_*・SUPABASE_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（#51）。
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      HOST: ${{ secrets.SERVER_HOST }}
      USERNAME: ${{ secrets.SERVER_USERNAME }}
      SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_PROJECT_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      TARGET_DIR: ${{ secrets.TARGET_DIR }}
      ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
      ANTHROPIC_OAUTH_REFRESH_TOKEN: ${{ secrets.ANTHROPIC_OAUTH_REFRESH_TOKEN }}
      OPENAI_CHATGPT_REFRESH_TOKEN: ${{ secrets.OPENAI_CHATGPT_REFRESH_TOKEN }}
      OPENAI_CHATGPT_ACCOUNT_ID: ${{ secrets.OPENAI_CHATGPT_ACCOUNT_ID }}
      GH_USAGE_TOKEN: ${{ secrets.GH_USAGE_TOKEN }}
      HOST_STATS_TOKEN: ${{ secrets.HOST_STATS_TOKEN }}
      UPTIMEROBOT_READ_ONLY_KEY: ${{ secrets.UPTIMEROBOT_READ_ONLY_KEY }}
      UPTIMEKUMA_USERNAME: ${{ secrets.UPTIMEKUMA_USERNAME }}
      UPTIMEKUMA_PASSWORD: ${{ secrets.UPTIMEKUMA_PASSWORD }}
      UPTIMEKUMA_ADMIN_TOKEN: ${{ secrets.UPTIMEKUMA_ADMIN_TOKEN }}
      WIDGET_TOKEN: ${{ secrets.WIDGET_TOKEN }}
      SHARED_TOKEN_API_SECRET: ${{ secrets.SHARED_TOKEN_API_SECRET }}
      SHARED_TOKEN_WRITE_SECRET: ${{ secrets.SHARED_TOKEN_WRITE_SECRET }}
      ISSUE_DECK_URL: ${{ vars.APP_BASE_URL }}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${{ secrets.WEB_PUSH_VAPID_PUBLIC_KEY }}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${{ secrets.WEB_PUSH_VAPID_PRIVATE_KEY }}
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}
      SIGNALY_LOGIN_WEBHOOK_URL: ${{ secrets.SIGNALY_LOGIN_WEBHOOK_URL }}
      SIGNALY_ALERT_WEBHOOK_URL: ${{ secrets.SIGNALY_ALERT_WEBHOOK_URL }}
      GH_USAGE_ORG: ${{ vars.GH_USAGE_ORG }}
      UPTIMEKUMA_BASE_URL: ${{ vars.UPTIMEKUMA_BASE_URL }}
      UPTIMEKUMA_DASHBOARD_SLUG: ${{ vars.UPTIMEKUMA_DASHBOARD_SLUG }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: ./

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ env.SSH_PRIVATE_KEY }}
          known_hosts: placeholder
          if_key_exists: replace

      - name: Add known hosts
        run: ssh-keyscan -p "${SSH_PORT}" -H "${HOST}" >> ~/.ssh/known_hosts
        env:
          HOST: ${{ env.HOST }}
          SSH_PORT: ${{ env.SSH_PORT }}

      # **VPSのgate（/usr/local/sbin/app-deploy-gate。guchi-apps/vps#275・#301）へ渡す**（#607）。
      # 鍵はこのアプリ専用で、VPSのauthorized_keysのcommand=がgateのアプリ名（ops-dashboard。置き場の
      # /home/github-user/apps/ops-dashboard とpm2のプロセス名に一致する。リポジトリ名はstatus-hubへ
      # 改めたが、置き場とプロセス名は旧名のまま。AGENTS.md冒頭）を固定する。任意のシェルコマンドは
      # 実行できず、upload・env・deployの3語だけが通る。旧配布物の削除・展開・.env更新・
      # npm ci --omit=dev・pm2の再起動・稼働版の照合（/api/app-version の sha）はgate側が行う。
      # Prismaを持たないため、マイグレーションの手順は無い（MIGRATE_DATABASE_URLも送らない）。
      - name: Upload archive
        run: ssh -p "${SSH_PORT}" "${USERNAME}@${HOST}" upload < deploy.tar.gz
        env:
          HOST: ${{ env.HOST }}
          USERNAME: ${{ env.USERNAME }}
          SSH_PORT: ${{ env.SSH_PORT }}

      - name: Send environment variables
        env:
          HOST: ${{ env.HOST }}
          USERNAME: ${{ env.USERNAME }}
          SSH_PORT: ${{ env.SSH_PORT }}
          # 稼働している版の照合に使う（#607。guchi-apps/car-care#257 と同じ形）。gateが.envの
          # APP_COMMIT_SHAと稼働中の /api/app-version の sha を照合する（guchi-apps/vps#298）。
          # コミットの SHA は公開情報なのでそのまま渡してよい
          APP_COMMIT_SHA: ${{ github.sha }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          ALLOWED_EMAILS: ${{ env.ALLOWED_EMAILS }}
          UPTIMEROBOT_READ_ONLY_KEY: ${{ env.UPTIMEROBOT_READ_ONLY_KEY }}
          UPTIMEKUMA_BASE_URL: ${{ env.UPTIMEKUMA_BASE_URL }}
          UPTIMEKUMA_DASHBOARD_SLUG: ${{ env.UPTIMEKUMA_DASHBOARD_SLUG }}
          UPTIMEKUMA_USERNAME: ${{ env.UPTIMEKUMA_USERNAME }}
          UPTIMEKUMA_PASSWORD: ${{ env.UPTIMEKUMA_PASSWORD }}
          UPTIMEKUMA_ADMIN_TOKEN: ${{ env.UPTIMEKUMA_ADMIN_TOKEN }}
          HOST_STATS_TOKEN: ${{ env.HOST_STATS_TOKEN }}
          SIGNALY_LOGIN_WEBHOOK_URL: ${{ env.SIGNALY_LOGIN_WEBHOOK_URL }}
          SIGNALY_ALERT_WEBHOOK_URL: ${{ env.SIGNALY_ALERT_WEBHOOK_URL }}
          ANTHROPIC_OAUTH_REFRESH_TOKEN: ${{ env.ANTHROPIC_OAUTH_REFRESH_TOKEN }}
          OPENAI_CHATGPT_REFRESH_TOKEN: ${{ env.OPENAI_CHATGPT_REFRESH_TOKEN }}
          OPENAI_CHATGPT_ACCOUNT_ID: ${{ env.OPENAI_CHATGPT_ACCOUNT_ID }}
          GH_USAGE_TOKEN: ${{ env.GH_USAGE_TOKEN }}
          GH_USAGE_ORG: ${{ env.GH_USAGE_ORG }}
          # 1Passwordのレート制限を表示するために、デプロイで使うものと同じトークンをそのまま渡す
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          WIDGET_TOKEN: ${{ env.WIDGET_TOKEN }}
          SHARED_TOKEN_API_SECRET: ${{ env.SHARED_TOKEN_API_SECRET }}
          SHARED_TOKEN_WRITE_SECRET: ${{ env.SHARED_TOKEN_WRITE_SECRET }}
          ISSUE_DECK_URL: ${{ env.ISSUE_DECK_URL }}
          TYPESAFE_USAGE_URL: ${{ secrets.TYPESAFE_USAGE_URL }}
          AI_APP_USAGE_SOURCES_WRITE_TOKEN: ${{ secrets.AI_APP_USAGE_SOURCES_WRITE_TOKEN }}
          WEB_PUSH_VAPID_PUBLIC_KEY: ${{ env.WEB_PUSH_VAPID_PUBLIC_KEY }}
          WEB_PUSH_VAPID_PRIVATE_KEY: ${{ env.WEB_PUSH_VAPID_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # 従来 .env へ書いていた値を1つも落とさない（StatusHubは他アプリのログイン許可を判定する
          # 共通アクセス設定を持つため、値の欠落が全アプリのログインに響く）。
          # 未登録のsecretは空文字として届き、従来の `${VAR:-}` と同じく空の値として書かれる。
          names=(
            NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY ALLOWED_EMAILS
            UPTIMEROBOT_READ_ONLY_KEY UPTIMEKUMA_BASE_URL UPTIMEKUMA_DASHBOARD_SLUG UPTIMEKUMA_USERNAME
            UPTIMEKUMA_PASSWORD UPTIMEKUMA_ADMIN_TOKEN HOST_STATS_TOKEN SIGNALY_LOGIN_WEBHOOK_URL
            SIGNALY_ALERT_WEBHOOK_URL ANTHROPIC_OAUTH_REFRESH_TOKEN OPENAI_CHATGPT_REFRESH_TOKEN
            OPENAI_CHATGPT_ACCOUNT_ID GH_USAGE_TOKEN GH_USAGE_ORG OP_SERVICE_ACCOUNT_TOKEN WIDGET_TOKEN
            SHARED_TOKEN_API_SECRET SHARED_TOKEN_WRITE_SECRET ISSUE_DECK_URL
            TYPESAFE_USAGE_URL AI_APP_USAGE_SOURCES_WRITE_TOKEN
            WEB_PUSH_VAPID_PUBLIC_KEY WEB_PUSH_VAPID_PRIVATE_KEY
          )
          # 空のまま書くと照合できないデプロイになるため、ここで止める
          if [ -z "${APP_COMMIT_SHA:-}" ]; then
            echo "::error::APP_COMMIT_SHA is empty."
            exit 1
          fi
          # gateは標準入力を1行1変数（KEY=VALUE）で受けるため、改行を含む値は送れない
          for name in "${names[@]}"; do
            case "${!name:-}" in
              *$'\n'*) echo "::error::${name} が改行を含むためgateへ送れません"; exit 1 ;;
            esac
          done
          {
            # 待受ポートはシークレットではなく設定値として平文で持つ
            # （guchi-apps/docs の standards/ports.md「ポート番号は 1Password で管理しない」。#111）。
            printf '%s\n' "NODE_ENV=production" "PORT=3110"
            # 共通アクセス設定のDBが本番であることを示す（秘密ではないためリテラルで渡す。#489）。
            # 未設定だと development 扱いになり、本番DBと食い違って全拒否になる
            printf '%s\n' "ACCESS_ENVIRONMENT=production"
            # 画面に並べる順番（VPS・サブPC・Mac Mini・Pi Zero W の順、それ以外は識別子順）。秘密ではないため直接指定する
            printf '%s\n' "HOST_STATS_ORDER=vps,subpc,macmini,pi0w"
            printf '%s\n' "APP_COMMIT_SHA=${APP_COMMIT_SHA}"
            for name in "${names[@]}"; do
              printf '%s=%s\n' "$name" "${!name:-}"
            done
          } | ssh -p "${SSH_PORT}" "${USERNAME}@${HOST}" env
          # 従来の SSH 先スクリプトにあった `bash scripts/remove-env-key.sh .env AIDE_WORK_REPORTS_TOKEN`
          # （#589 の後片付け）はgateに移せない（gateは .env のキーを消す手段を持たない）。main へは
          # 既に出ており本番の .env から消えている前提で落とした。今後キーを消すときは手作業になる

      - name: Deploy and restart
        run: ssh -p "${SSH_PORT}" "${USERNAME}@${HOST}" deploy
        env:
          HOST: ${{ env.HOST }}
          USERNAME: ${{ env.USERNAME }}
          SSH_PORT: ${{ env.SSH_PORT }}

      - name: Signaly に通知
        # 通知のためだけにジョブを分けない（notify-releaseと同じ理由）。deployが動かなかった
        # 場合（tag/buildで失敗・キャンセル）の通知は下のnotifyジョブが受け持つ。
        #
        # 通知はデプロイの合否そのものではない。ここが失敗してもrun全体を落とさない
        # （guchi-apps/issue-deck#1302）。
        if: always()
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          NOTIFY_APP: ops-dashboard
          NOTIFY_KIND: デプロイ
          NOTIFY_STATUS: ${{ job.status }}
        run: bash .github/scripts/signaly-notify.sh

  notify:
    runs-on: ubuntu-latest
    needs: [tag, build, deploy]
    # deployジョブが動かなかったとき（tag/buildで失敗・キャンセルし、deployがskipされた
    # とき）だけの保険。deployが動いた場合の通知はdeployジョブの最終ステップが送る。
    # Actionsの課金はジョブ単位で1分に切り上げられるため、成功時に数秒の通知専用ジョブを
    # 立てない。
    if: always() && needs.deploy.result == 'skipped'

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んでいたが、
    # サービスアカウントの日次レート制限を使い切ってフリート全体のデプロイが止まった
    # （guchi-apps/issue-deck#1302）。SERVER_*・SUPABASE_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（#51）。
    env:
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine workflow status
        id: status
        run: |
          tag="${{ needs.tag.result }}"
          build="${{ needs.build.result }}"
          deploy="${{ needs.deploy.result }}"
          if [ "$tag" = "success" ] && [ "$build" = "success" ] && [ "$deploy" = "success" ]; then
            result=success
          elif [ "$tag" = "cancelled" ] || [ "$build" = "cancelled" ] || [ "$deploy" = "cancelled" ]; then
            result=cancelled
          else
            result=failure
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Signaly に通知
        # 通知はCIやデプロイの合否そのものではない。ここが失敗してもrun全体を落とさない
        # （guchi-apps/issue-deck#1302）。
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          NOTIFY_APP: ops-dashboard
          NOTIFY_KIND: デプロイ
          NOTIFY_STATUS: ${{ steps.status.outputs.result }}
        run: bash .github/scripts/signaly-notify.sh
