name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-ops-dashboard-production
  cancel-in-progress: true

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create Git tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          HEAD_SHA=$(git rev-parse HEAD)

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-parse "$TAG")
            if [ "$TAG_SHA" = "$HEAD_SHA" ]; then
              echo "Tag ${TAG} already points to HEAD"
              exit 0
            fi
            echo "::error::Tag ${TAG} already exists on ${TAG_SHA}, but HEAD is ${HEAD_SHA}. Bump package.json version before merging."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

  release:
    runs-on: ubuntu-latest
    needs: [tag, deploy]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect prerelease
        id: meta
        run: |
          TAG="${{ needs.tag.outputs.tag }}"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          skip_if_release_exists: true

      - name: Signaly に通知
        # 通知のためだけにジョブを分けない。Actionsの課金はジョブ単位で1分に切り上げられる
        # ため、数秒で終わるnotify-releaseジョブが実行のたびに1分かかっていた。
        #
        # 通知はリリースの合否そのものではない。ここが失敗してもrun全体を落とさない
        # （guchi-apps/issue-deck#1302）。
        if: always()
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}
          NOTIFY_STATUS: ${{ job.status }}
          NOTIFY_APP: ops-dashboard
          SIGNALY_RELEASE_WEBHOOK_URL: ${{ secrets.SIGNALY_RELEASE_WEBHOOK_URL }}
          NOTIFY_KIND: リリース
          NOTIFY_VERSION: ${{ needs.tag.outputs.tag }}
        run: bash .github/scripts/signaly-notify.sh

  build:
    runs-on: ubuntu-latest
    needs: tag

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んでいたが、
    # サービスアカウントの日次レート制限を使い切ってフリート全体のデプロイが止まった
    # （guchi-apps/issue-deck#1302）。SERVER_*・SUPABASE_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（#51）。
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
      HOST: ${{ secrets.SERVER_HOST }}
      USERNAME: ${{ secrets.SERVER_USERNAME }}
      SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_PROJECT_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      TARGET_DIR: ${{ secrets.TARGET_DIR }}
      ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
      ANTHROPIC_OAUTH_REFRESH_TOKEN: ${{ secrets.ANTHROPIC_OAUTH_REFRESH_TOKEN }}
      OPENAI_CHATGPT_REFRESH_TOKEN: ${{ secrets.OPENAI_CHATGPT_REFRESH_TOKEN }}
      OPENAI_CHATGPT_ACCOUNT_ID: ${{ secrets.OPENAI_CHATGPT_ACCOUNT_ID }}
      GH_USAGE_TOKEN: ${{ secrets.GH_USAGE_TOKEN }}
      HOST_STATS_TOKEN: ${{ secrets.HOST_STATS_TOKEN }}
      UPTIMEROBOT_READ_ONLY_KEY: ${{ secrets.UPTIMEROBOT_READ_ONLY_KEY }}
      UPTIMEKUMA_USERNAME: ${{ secrets.UPTIMEKUMA_USERNAME }}
      UPTIMEKUMA_PASSWORD: ${{ secrets.UPTIMEKUMA_PASSWORD }}
      UPTIMEKUMA_ADMIN_TOKEN: ${{ secrets.UPTIMEKUMA_ADMIN_TOKEN }}
      WIDGET_TOKEN: ${{ secrets.WIDGET_TOKEN }}
      OPS_API_TOKEN: ${{ secrets.OPS_API_TOKEN }}
      AIDE_STATUS_TOKEN: ${{ secrets.AIDE_STATUS_TOKEN }}
      SHARED_TOKEN_API_SECRET: ${{ secrets.SHARED_TOKEN_API_SECRET }}
      SHARED_TOKEN_WRITE_SECRET: ${{ secrets.SHARED_TOKEN_WRITE_SECRET }}
      ISSUE_DECK_URL: ${{ vars.APP_BASE_URL }}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${{ secrets.WEB_PUSH_VAPID_PUBLIC_KEY }}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${{ secrets.WEB_PUSH_VAPID_PRIVATE_KEY }}
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}
      SIGNALY_LOGIN_WEBHOOK_URL: ${{ secrets.SIGNALY_LOGIN_WEBHOOK_URL }}
      SIGNALY_ALERT_WEBHOOK_URL: ${{ secrets.SIGNALY_ALERT_WEBHOOK_URL }}
      GH_USAGE_ORG: ${{ vars.GH_USAGE_ORG }}
      UPTIMEKUMA_BASE_URL: ${{ vars.UPTIMEKUMA_BASE_URL }}
      UPTIMEKUMA_DASHBOARD_SLUG: ${{ vars.UPTIMEKUMA_DASHBOARD_SLUG }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          ALLOWED_EMAILS: ${{ env.ALLOWED_EMAILS }}
          UPTIMEROBOT_READ_ONLY_KEY: ${{ env.UPTIMEROBOT_READ_ONLY_KEY }}
          UPTIMEKUMA_BASE_URL: ${{ env.UPTIMEKUMA_BASE_URL }}
          UPTIMEKUMA_DASHBOARD_SLUG: ${{ env.UPTIMEKUMA_DASHBOARD_SLUG }}
          SIGNALY_LOGIN_WEBHOOK_URL: ${{ env.SIGNALY_LOGIN_WEBHOOK_URL }}

      - name: Create archive
        run: |
          tar -czf deploy.tar.gz \
            package.json \
            package-lock.json \
            public \
            .next \
            deploy \
            scripts \
            next.config.mjs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: deploy.tar.gz
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んでいたが、
    # サービスアカウントの日次レート制限を使い切ってフリート全体のデプロイが止まった
    # （guchi-apps/issue-deck#1302）。SERVER_*・SUPABASE_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（#51）。
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
      HOST: ${{ secrets.SERVER_HOST }}
      USERNAME: ${{ secrets.SERVER_USERNAME }}
      SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_PROJECT_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      TARGET_DIR: ${{ secrets.TARGET_DIR }}
      ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
      ANTHROPIC_OAUTH_REFRESH_TOKEN: ${{ secrets.ANTHROPIC_OAUTH_REFRESH_TOKEN }}
      OPENAI_CHATGPT_REFRESH_TOKEN: ${{ secrets.OPENAI_CHATGPT_REFRESH_TOKEN }}
      OPENAI_CHATGPT_ACCOUNT_ID: ${{ secrets.OPENAI_CHATGPT_ACCOUNT_ID }}
      GH_USAGE_TOKEN: ${{ secrets.GH_USAGE_TOKEN }}
      HOST_STATS_TOKEN: ${{ secrets.HOST_STATS_TOKEN }}
      UPTIMEROBOT_READ_ONLY_KEY: ${{ secrets.UPTIMEROBOT_READ_ONLY_KEY }}
      UPTIMEKUMA_USERNAME: ${{ secrets.UPTIMEKUMA_USERNAME }}
      UPTIMEKUMA_PASSWORD: ${{ secrets.UPTIMEKUMA_PASSWORD }}
      UPTIMEKUMA_ADMIN_TOKEN: ${{ secrets.UPTIMEKUMA_ADMIN_TOKEN }}
      WIDGET_TOKEN: ${{ secrets.WIDGET_TOKEN }}
      OPS_API_TOKEN: ${{ secrets.OPS_API_TOKEN }}
      AIDE_STATUS_TOKEN: ${{ secrets.AIDE_STATUS_TOKEN }}
      SHARED_TOKEN_API_SECRET: ${{ secrets.SHARED_TOKEN_API_SECRET }}
      SHARED_TOKEN_WRITE_SECRET: ${{ secrets.SHARED_TOKEN_WRITE_SECRET }}
      ISSUE_DECK_URL: ${{ vars.APP_BASE_URL }}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${{ secrets.WEB_PUSH_VAPID_PUBLIC_KEY }}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${{ secrets.WEB_PUSH_VAPID_PRIVATE_KEY }}
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}
      SIGNALY_LOGIN_WEBHOOK_URL: ${{ secrets.SIGNALY_LOGIN_WEBHOOK_URL }}
      SIGNALY_ALERT_WEBHOOK_URL: ${{ secrets.SIGNALY_ALERT_WEBHOOK_URL }}
      GH_USAGE_ORG: ${{ vars.GH_USAGE_ORG }}
      UPTIMEKUMA_BASE_URL: ${{ vars.UPTIMEKUMA_BASE_URL }}
      UPTIMEKUMA_DASHBOARD_SLUG: ${{ vars.UPTIMEKUMA_DASHBOARD_SLUG }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: ./

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ env.SSH_PRIVATE_KEY }}
          known_hosts: placeholder
          if_key_exists: replace

      - name: Add known hosts
        run: ssh-keyscan -p "${SSH_PORT}" -H "${HOST}" >> ~/.ssh/known_hosts
        env:
          HOST: ${{ env.HOST }}
          SSH_PORT: ${{ env.SSH_PORT }}

      - name: Upload archive
        run: scp -P "${SSH_PORT}" deploy.tar.gz "${USERNAME}@${HOST}:${TARGET_DIR}/deploy.tar.gz"
        env:
          HOST: ${{ env.HOST }}
          USERNAME: ${{ env.USERNAME }}
          SSH_PORT: ${{ env.SSH_PORT }}
          TARGET_DIR: ${{ env.TARGET_DIR }}

      - name: Deploy and restart
        uses: appleboy/ssh-action@v1
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          ALLOWED_EMAILS: ${{ env.ALLOWED_EMAILS }}
          UPTIMEROBOT_READ_ONLY_KEY: ${{ env.UPTIMEROBOT_READ_ONLY_KEY }}
          UPTIMEKUMA_BASE_URL: ${{ env.UPTIMEKUMA_BASE_URL }}
          UPTIMEKUMA_DASHBOARD_SLUG: ${{ env.UPTIMEKUMA_DASHBOARD_SLUG }}
          UPTIMEKUMA_USERNAME: ${{ env.UPTIMEKUMA_USERNAME }}
          UPTIMEKUMA_PASSWORD: ${{ env.UPTIMEKUMA_PASSWORD }}
          UPTIMEKUMA_ADMIN_TOKEN: ${{ env.UPTIMEKUMA_ADMIN_TOKEN }}
          SIGNALY_LOGIN_WEBHOOK_URL: ${{ env.SIGNALY_LOGIN_WEBHOOK_URL }}
          SIGNALY_ALERT_WEBHOOK_URL: ${{ env.SIGNALY_ALERT_WEBHOOK_URL }}
          ANTHROPIC_OAUTH_REFRESH_TOKEN: ${{ env.ANTHROPIC_OAUTH_REFRESH_TOKEN }}
          OPENAI_CHATGPT_REFRESH_TOKEN: ${{ env.OPENAI_CHATGPT_REFRESH_TOKEN }}
          OPENAI_CHATGPT_ACCOUNT_ID: ${{ env.OPENAI_CHATGPT_ACCOUNT_ID }}
          GH_USAGE_TOKEN: ${{ env.GH_USAGE_TOKEN }}
          GH_USAGE_ORG: ${{ env.GH_USAGE_ORG }}
          # 1Passwordのレート制限を表示するために、デプロイで使うものと同じトークンをそのまま渡す
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          WIDGET_TOKEN: ${{ env.WIDGET_TOKEN }}
          OPS_API_TOKEN: ${{ env.OPS_API_TOKEN }}
          AIDE_STATUS_TOKEN: ${{ env.AIDE_STATUS_TOKEN }}
          SHARED_TOKEN_API_SECRET: ${{ env.SHARED_TOKEN_API_SECRET }}
          SHARED_TOKEN_WRITE_SECRET: ${{ env.SHARED_TOKEN_WRITE_SECRET }}
          ISSUE_DECK_URL: ${{ env.ISSUE_DECK_URL }}
          TYPESAFE_USAGE_URL: ${{ secrets.TYPESAFE_USAGE_URL }}
          TYPESAFE_USAGE_TOKEN: ${{ secrets.TYPESAFE_USAGE_TOKEN }}
          AI_APP_USAGE_SOURCES_WRITE_TOKEN: ${{ secrets.AI_APP_USAGE_SOURCES_WRITE_TOKEN }}
          WEB_PUSH_VAPID_PUBLIC_KEY: ${{ env.WEB_PUSH_VAPID_PUBLIC_KEY }}
          WEB_PUSH_VAPID_PRIVATE_KEY: ${{ env.WEB_PUSH_VAPID_PRIVATE_KEY }}
          TARGET_DIR: ${{ env.TARGET_DIR }}
        with:
          host: ${{ env.HOST }}
          username: ${{ env.USERNAME }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          port: ${{ env.SSH_PORT }}
          envs: NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,ALLOWED_EMAILS,UPTIMEROBOT_READ_ONLY_KEY,UPTIMEKUMA_BASE_URL,UPTIMEKUMA_DASHBOARD_SLUG,UPTIMEKUMA_USERNAME,UPTIMEKUMA_PASSWORD,UPTIMEKUMA_ADMIN_TOKEN,HOST_STATS_TOKEN,SIGNALY_LOGIN_WEBHOOK_URL,SIGNALY_ALERT_WEBHOOK_URL,ANTHROPIC_OAUTH_REFRESH_TOKEN,OPENAI_CHATGPT_REFRESH_TOKEN,OPENAI_CHATGPT_ACCOUNT_ID,GH_USAGE_TOKEN,GH_USAGE_ORG,OP_SERVICE_ACCOUNT_TOKEN,WIDGET_TOKEN,OPS_API_TOKEN,AIDE_STATUS_TOKEN,SHARED_TOKEN_API_SECRET,SHARED_TOKEN_WRITE_SECRET,ISSUE_DECK_URL,TYPESAFE_USAGE_URL,TYPESAFE_USAGE_TOKEN,AI_APP_USAGE_SOURCES_WRITE_TOKEN,WEB_PUSH_VAPID_PUBLIC_KEY,WEB_PUSH_VAPID_PRIVATE_KEY,TARGET_DIR
          script: |
            set -euo pipefail
            cd "${TARGET_DIR}"

            # 待受ポートはシークレットではなく設定値として平文で持つ
            # （guchi-apps/docs の standards/ports.md「ポート番号は 1Password で管理しない」。#111）。
            PORT=3110

            echo "Cleaning up old release files..."
            rm -rf .next package.json package-lock.json public deploy scripts next.config.mjs next.config.ts

            echo "Extracting archive..."
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz

            update_env() {
              bash scripts/update-env-file.sh .env "$1" "$2"
            }

            echo "Updating .env..."
            update_env NODE_ENV production
            # 共通アクセス設定のDBが本番であることを示す（秘密ではないためリテラルで渡す。#489）。
            # 未設定だと development 扱いになり、本番DBと食い違って全拒否になる
            update_env ACCESS_ENVIRONMENT production
            update_env PORT "$PORT"
            update_env NEXT_PUBLIC_SUPABASE_URL "$NEXT_PUBLIC_SUPABASE_URL"
            update_env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
            update_env ALLOWED_EMAILS "$ALLOWED_EMAILS"
            update_env UPTIMEROBOT_READ_ONLY_KEY "$UPTIMEROBOT_READ_ONLY_KEY"
            update_env UPTIMEKUMA_BASE_URL "$UPTIMEKUMA_BASE_URL"
            update_env UPTIMEKUMA_DASHBOARD_SLUG "$UPTIMEKUMA_DASHBOARD_SLUG"
            update_env UPTIMEKUMA_USERNAME "$UPTIMEKUMA_USERNAME"
            update_env UPTIMEKUMA_PASSWORD "$UPTIMEKUMA_PASSWORD"
            update_env UPTIMEKUMA_ADMIN_TOKEN "$UPTIMEKUMA_ADMIN_TOKEN"
            update_env HOST_STATS_TOKEN "$HOST_STATS_TOKEN"
            # 画面に並べる順番（先頭がVPS、以降は識別子順）。秘密ではないため直接指定する
            update_env HOST_STATS_ORDER "vps"
            update_env SIGNALY_LOGIN_WEBHOOK_URL "$SIGNALY_LOGIN_WEBHOOK_URL"
            # secret未登録でもデプロイを落とさない（未設定なら通知しないだけ。#75）。
            # このスクリプトは set -u の下で動くため、素の $VAR だと未登録の間は必ず失敗する
            update_env SIGNALY_ALERT_WEBHOOK_URL "${SIGNALY_ALERT_WEBHOOK_URL:-}"
            update_env ANTHROPIC_OAUTH_REFRESH_TOKEN "$ANTHROPIC_OAUTH_REFRESH_TOKEN"
            update_env OPENAI_CHATGPT_REFRESH_TOKEN "$OPENAI_CHATGPT_REFRESH_TOKEN"
            update_env OPENAI_CHATGPT_ACCOUNT_ID "$OPENAI_CHATGPT_ACCOUNT_ID"
            update_env GH_USAGE_TOKEN "$GH_USAGE_TOKEN"
            update_env GH_USAGE_ORG "$GH_USAGE_ORG"
            update_env OP_SERVICE_ACCOUNT_TOKEN "$OP_SERVICE_ACCOUNT_TOKEN"
            update_env WIDGET_TOKEN "$WIDGET_TOKEN"
            update_env OPS_API_TOKEN "$OPS_API_TOKEN"
            # secret未登録でもデプロイを落とさない（未設定ならAIDEタブを出さないだけ。#237）
            update_env AIDE_STATUS_TOKEN "${AIDE_STATUS_TOKEN:-}"
            # secret未登録でもデプロイを落とさない（未設定ならAIDE_STATUS_TOKENへフォールバックするだけ。#444）
            update_env SHARED_TOKEN_API_SECRET "${SHARED_TOKEN_API_SECRET:-}"
            update_env SHARED_TOKEN_WRITE_SECRET "${SHARED_TOKEN_WRITE_SECRET:-}"
            update_env ISSUE_DECK_URL "${ISSUE_DECK_URL:-}"
            # secret未登録でもデプロイを落とさない（未設定ならTypeSafe AIカードを出さないだけ。#302）
            update_env TYPESAFE_USAGE_URL "${TYPESAFE_USAGE_URL:-}"
            update_env TYPESAFE_USAGE_TOKEN "${TYPESAFE_USAGE_TOKEN:-}"
            # secret未登録でもデプロイを落とさない（未設定なら画面からの編集だけ使える。#431）
            update_env AI_APP_USAGE_SOURCES_WRITE_TOKEN "${AI_APP_USAGE_SOURCES_WRITE_TOKEN:-}"
            # secret未登録でもデプロイを落とさない（未設定なら通知のベルを出さないだけ。#263）
            update_env WEB_PUSH_VAPID_PUBLIC_KEY "${WEB_PUSH_VAPID_PUBLIC_KEY:-}"
            update_env WEB_PUSH_VAPID_PRIVATE_KEY "${WEB_PUSH_VAPID_PRIVATE_KEY:-}"

            echo "Installing production dependencies..."
            npm install --omit=dev --no-audit --prefer-offline

            echo "Restarting PM2..."
            if command -v pm2 >/dev/null 2>&1; then
              pm2 delete ops-dashboard 2>/dev/null || true
              PORT="$PORT" pm2 start deploy/ecosystem.config.js --env production
              pm2 save
            else
              echo "pm2 is required on the server. Install: npm install -g pm2"
              exit 1
            fi

            echo "Health check..."
            # Next.js は起動完了までに数秒かかる。1回だけの curl では起動を待ちきれず、
            # アプリが正常に立ち上がっていても deploy ジョブが失敗する（guchi-apps/docs#29）。
            for i in $(seq 1 30); do
              if curl -fsS -o /dev/null "http://127.0.0.1:${PORT}/login"; then
                echo "Deployment successful."
                exit 0
              fi
              sleep 2
            done

            echo "Health check failed after 60s."
            pm2 describe ops-dashboard || true
            pm2 logs ops-dashboard --lines 50 --nostream || true
            exit 1

      - name: Signaly に通知
        # 通知のためだけにジョブを分けない（notify-releaseと同じ理由）。deployが動かなかった
        # 場合（tag/buildで失敗・キャンセル）の通知は下のnotifyジョブが受け持つ。
        #
        # 通知はデプロイの合否そのものではない。ここが失敗してもrun全体を落とさない
        # （guchi-apps/issue-deck#1302）。
        if: always()
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          NOTIFY_APP: ops-dashboard
          NOTIFY_KIND: デプロイ
          NOTIFY_STATUS: ${{ job.status }}
        run: bash .github/scripts/signaly-notify.sh

  notify:
    runs-on: ubuntu-latest
    needs: [tag, build, deploy]
    # deployジョブが動かなかったとき（tag/buildで失敗・キャンセルし、deployがskipされた
    # とき）だけの保険。deployが動いた場合の通知はdeployジョブの最終ステップが送る。
    # Actionsの課金はジョブ単位で1分に切り上げられるため、成功時に数秒の通知専用ジョブを
    # 立てない。
    if: always() && needs.deploy.result == 'skipped'

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んでいたが、
    # サービスアカウントの日次レート制限を使い切ってフリート全体のデプロイが止まった
    # （guchi-apps/issue-deck#1302）。SERVER_*・SUPABASE_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（#51）。
    env:
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine workflow status
        id: status
        run: |
          tag="${{ needs.tag.result }}"
          build="${{ needs.build.result }}"
          deploy="${{ needs.deploy.result }}"
          if [ "$tag" = "success" ] && [ "$build" = "success" ] && [ "$deploy" = "success" ]; then
            result=success
          elif [ "$tag" = "cancelled" ] || [ "$build" = "cancelled" ] || [ "$deploy" = "cancelled" ]; then
            result=cancelled
          else
            result=failure
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Signaly に通知
        # 通知はCIやデプロイの合否そのものではない。ここが失敗してもrun全体を落とさない
        # （guchi-apps/issue-deck#1302）。
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          NOTIFY_APP: ops-dashboard
          NOTIFY_KIND: デプロイ
          NOTIFY_STATUS: ${{ steps.status.outputs.result }}
        run: bash .github/scripts/signaly-notify.sh
