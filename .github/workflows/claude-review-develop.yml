name: Claude Code Review (develop向けPR)

# develop向けPRの作成・更新時に、機械的リスク判定・Claude Codeによる自動レビュー・
# 低リスクPRの自動マージを行うワークフローの、本リポジトリ側のトリガー定義。ジョブ本体は
# 持たず、issue-deckの再利用可能ワークフローを参照する
# （guchi-apps/issue-deck#1078・#1090）。
#
# issue-deckの画面（設定＞フリート運用）から配布された雛形に、ops-dashboard固有の設定を
# 足してある（guchi-apps/issue-deck#1475・#233）。
#
# **このリポジトリではdevelop向けPRを毎回レビューする**（#233）。再利用ワークフローの既定は
# 「リスクパスに該当」か「10ファイルまたは500行以上」のときだけ`claude-review`を走らせる
# （guchi-apps/issue-deck#992。コスト削減のため）が、既定のままだとトークン処理を変えた#223を
# 含む直近のPRがすべてskipされていた。数行でも致命的になりうる変更（表示ロジックの破損で
# 障害を正常と見せる、など）はパスで列挙できないため、`review-file-threshold`を1にして
# 差分があれば必ず実行する（lockファイルだけの差分は数えないのでskipされる）。
#
# `risk-paths`には、AGENTS.md「自動マージ不可カテゴリ」のうちパス名から判別できないもの
# （認証・APIルート・外部サービスのトークンを扱うクライアント）を足してある。レビューは
# 閾値で毎回走るが、該当するとレビュー実行の理由に出てレビュー時の判断材料になる。
# `merge-policy`は既定の`relaxed`のままなので、該当してもマージは止めない。
# カテゴリに当たるファイルを増やしたときは、ここも合わせて更新する。
#
# 内蔵パターン（`.github/workflows/**`・`.env*`・`.shared-context/**`・
# `prisma/migrations/**`・`**/auth/**`）は再利用ワークフロー側が常に判定するため書かない。
# **入力はリスクを追加できるが削減はできない。**
#
# 参照はタグ固定にする。@developを参照するとissue-deck側の不具合が即座に波及するため。
#
# トリガー(`on:`)はジョブ本体と違って各リポジトリのcallerが持つコピーなので、issue-deck側で
# 直しても波及しない（guchi-apps/issue-deck#1366）。
#
# **自動マージには`develop`のブランチ保護（必須ステータスチェック）が要る。** 保護が無いと
# `gh pr merge --auto`が「既にマージ可能」として断られ、auto-merge-fallbackが毎回
# `00.check-user`を付けるだけで終わる。配布時に画面側が保護まで作る
# （guchi-apps/issue-deck#1475）。
#
# concurrency: develop向けPRへのpush(synchronize)のたびに起動するため、実装エージェントが
# 同一PRへ連続してpushすると古いpush分のClaude Code呼び出しがそのまま走り切る（#818）。
# 新しいpushが来たら古い実行を丸ごとキャンセルする。呼び出し元のワークフローレベルに置く
# ことで、呼び出し先のジョブも一緒にキャンセルされる。
concurrency:
  group: claude-review-develop-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop

jobs:
  review:
    uses: guchi-apps/issue-deck/.github/workflows/reusable-claude-review-develop.yml@workflows/v44
    with:
      # 差分があれば毎回レビューする（冒頭コメント参照。#233）。
      review-file-threshold: "1"
      # 内蔵パターンでは拾えないもののうち、**どのリポジトリにも共通で置けるぶん**だけ。
      #
      # - `.env.tpl`は内蔵の`.env*`（`(^|/)\.env`）に当たらない
      #   （`.github/deploy.env.tpl`のようにファイル名の途中に現れるため）
      # - デプロイ資材のディレクトリ名は`deploy/`と`deployment/`に割れている（myroom）
      # - **`dependency-check`はルートの`package.json`しか見ない。** ルートに置いていない
      #   リポジトリ（signalyは`backend/requirements.txt`だけ、myroomはルートが空スタブで
      #   実体が`frontend/package.json`・`requirements.txt`）では依存の更新が一度も
      #   リスク判定されないため、依存ファイルのパスで補う
      risk-paths: |
        ^deploy(ment)?/|\.env\.tpl$ :: 本番環境設定の変更 (deploy/**, deployment/**, **/*.env.tpl)
        ^\.github/secrets-manifest\.tsv$ :: シークレット定義の変更 (.github/secrets-manifest.tsv)
        (^|/)requirements[^/]*\.txt$|(^|/)pyproject\.toml$|(^|/)Pipfile$ :: 依存関係の変更 (requirements*.txt, pyproject.toml, Pipfile)
        /package\.json$ :: ルート以外の依存関係の変更 (frontend/package.json など。dependency-checkはルートしか見ない)
        # ここからops-dashboard固有（AGENTS.md「自動マージ不可カテゴリ」のうちパス名から判別できないもの）。
        # `/api/*` はproxyの認証から外してあり（src/proxy.tsのPUBLIC_PATH_PREFIXES）、保護は
        # src/lib/session.ts とルート側だけが担う
        ^src/(proxy\.ts$|lib/(supabase/|allowed-emails\.ts$|session\.ts$)) :: 認証・セッション・許可ユーザー判定の変更 (src/proxy.ts, src/lib/supabase/**, src/lib/allowed-emails.ts, src/lib/session.ts)
        ^src/(lib/access/|app/admin/|types/node-sqlite\.d\.ts$)|^scripts/access-(recover|migrate|migration-core)\.mjs$ :: 共通アクセス設定（認可の判定・管理画面・復旧CLI・移行CLI）の変更 (src/lib/access/**, src/app/admin/**, scripts/access-recover.mjs, scripts/access-migrate.mjs, scripts/access-migration-core.mjs)
        ^src/app/api/ :: APIルートの変更 (src/app/api/**。proxyの認証対象外で、ルート側で認証する)
        ^src/lib/(ai-usage/|claude-usage\.ts$|onepassword-usage\.ts$|uptimerobot\.ts$|uptime-kuma(-admin)?\.ts$|github-(usage|repo-visibility)\.ts$|(shared|ops-api)-token\.ts$|aide-status\.ts$|ai-app-usage/) :: 外部サービスのトークンを扱うAPIクライアントの変更 (AI利用枠・1Password・UptimeRobot・Uptime Kuma・GitHub・共有トークンAPI・AIDE・アプリ別AI利用)
        ^src/lib/push/ :: プッシュ通知の鍵（VAPID秘密鍵）を扱う送信処理の変更 (src/lib/push/**)
        ^scripts/sync-github-secrets\.sh$ :: シークレット同期スクリプトの変更 (scripts/sync-github-secrets.sh)
      # 上の uses: と同じタグを指定する。片方だけ上げると新しいワークフローで
      # 古いプロンプトが使われる。
      prompts-ref: workflows/v44
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
