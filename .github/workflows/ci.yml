name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ビルド・テストに必要な最小限のプレースホルダー環境変数（本番の1Password参照は不要）
  NEXT_PUBLIC_SUPABASE_URL: https://dummy-project.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: dummy-publishable-key-for-ci-only
  ALLOWED_EMAILS: test@example.com
  UPTIMEROBOT_READ_ONLY_KEY: dummy-key
  UPTIMEKUMA_BASE_URL: https://dummy-uptime-kuma.example.com
  UPTIMEKUMA_DASHBOARD_SLUG: dummy-slug
  SYSTEM_STATS_DISK_PATH: /

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build check
        run: npm run build

  notify:
    needs: [verify]
    # 通知が要るときだけジョブを起こす。Actionsの課金はジョブ単位で1分に切り上げられる
    # ため、`always()`で毎回起こすと5秒で終わる空振りにも1分かかっていた。スキップされた
    # ジョブは課金されないので、送信可否の判断をステップからジョブの`if:`へ引き上げる。
    #
    # 条件は「Determine workflow status」が持っていたshould_notifyと同じ。
    # develop push: failure only. main PR: success, failure, and cancelled.
    if: >-
      always()
      && ((needs.verify.result != 'success' && needs.verify.result != 'cancelled')
      || (github.event_name == 'pull_request' && github.base_ref == 'main'))
    runs-on: ubuntu-latest
    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んでいたが、
    # サービスアカウントの日次レート制限を使い切ってフリート全体のデプロイが止まった
    # （guchi-apps/issue-deck#1302）。SERVER_*・SUPABASE_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（#51）。
    env:
      DISCORD_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Determine workflow status
        id: status
        run: |
          verify="${{ needs.verify.result }}"
          if [ "$verify" = "success" ]; then
            result=success
          elif [ "$verify" = "cancelled" ]; then
            result=cancelled
          else
            result=failure
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "jobs=verify: $verify" >> "$GITHUB_OUTPUT"

      - name: Discord に失敗を通知
        # 通知はCIやデプロイの合否そのものではない。ここが失敗してもrun全体を落とさない
        # （guchi-apps/issue-deck#1302）。
        continue-on-error: true
        env:
          DISCORD_ALERT_WEBHOOK_URL: ${{ env.DISCORD_ALERT_WEBHOOK_URL }}
          NOTIFY_APP: ops-dashboard
          NOTIFY_KIND: CI
          NOTIFY_STATUS: ${{ steps.status.outputs.result }}
          NOTIFY_JOB: ${{ steps.status.outputs.jobs }}
        run: bash .github/scripts/discord-alert-notify.sh
