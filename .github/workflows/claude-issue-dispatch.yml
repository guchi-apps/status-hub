name: Claude Issue Dispatch

# Issueへの`@claude`コメントを起点に、計画提示・実装・develop向けPR作成までをGitHub Actions上で
# 無人実行するワークフローの、ops-dashboard側のトリガー定義。
#
# ジョブ本体はguchi-apps/issue-deckのreusable-issue-dispatch.ymlにあり、ここでは`uses:`で参照する
# だけにしている。技術スタックの差はwith:のinputsで吸収する。
#
# `uses:`のタグと`prompts-ref`は必ず同じ値にする。`uses:`だけ上げるとプロンプト
# (.github/prompts/配下)が古いタグのまま参照され、新しいワークフローで古いプロンプトが動く。
# なお`prompts-ref`を空にすると呼び出し元(このリポジトリ)の.github/prompts/を読みに行き、
# ops-dashboardはそれを持たないため最初のClaudeステップで落ちる。
#
# 動作の詳細(21.plan-requiredの二段階トリガー、mode=ask/plan/split/implement/additionalの
# 判定、11.localによる二重起動防止など)は、issue-deckのdocs/multi-agent/dispatch.mdを参照する。
on:
  issues:
    types: [unlabeled]
  issue_comment:
    types: [created]
  # 計画/実装のフォールバック検証ステップ専用の自己リトライ起動経路。
  # issue_number/retry_attemptはgh workflow runから渡される想定だが、人間が直接手動実行してもよい。
  workflow_dispatch:
    inputs:
      issue_number:
        description: "対象issue番号"
        required: true
        type: string
      retry_attempt:
        description: "これまでの自動リトライ回数(0始まり。指定した回数の次の試行として実行する)"
        required: false
        type: string
        default: "0"

jobs:
  dispatch:
    uses: guchi-apps/issue-deck/.github/workflows/reusable-issue-dispatch.yml@workflows/v44
    with:
      # ops-dashboardはprisma/を持たずDBを使わないため node。node-dbにすると不要な
      # MySQLサービスコンテナの起動・マイグレーション・シードが動く。
      runtime-setup: node
      # package-lock.json のため npm(inputsの既定値と同じだが、判断の根拠を残すため明示する)。
      package-manager: npm
      # database-name は runtime-setup: node では使われないため指定しない。
      #
      # 実装ステップのNodeをCI(.github/workflows/ci.yml)と揃える。CIはnode-version-fileで
      # .nvmrcを読むが、**共有ワークフローは.nvmrcを読まない**ため、ここに同じ値を明示する。
      node-version: "22.23.1"
      # uses: のタグと必ず同じ値にする。
      prompts-ref: workflows/v44
    # CLAUDE_CODE_OAUTH_TOKEN・WORKFLOW_PATを呼ばれる側へ渡す。
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
